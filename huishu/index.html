-items:center;margin-top:13px;color:#BBD1C9;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:27px 1px 13px}.section-title h2{font-size:19px;margin:0;font-weight:760;letter-spacing:-.5px}.muted{color:var(--sub);font-size:12px}.filters{display:flex;align-items:center;gap:8px;margin:0 0 15px}.filter{border:1px solid #E5EAE6;color:#70827C;background:white;border-radius:100px;font-size:12px;font-weight:650;padding:8px 16px}.filter.active{background:#1F5147;color:#fff;border-color:#1F5147}.item{background:#fff;border:1px solid #EBEFEB;border-radius:17px;box-shadow:0 3px 14px #132F2A05;margin-bottom:11px;padding:17px 16px 16px}.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.item-path{font-size:11px;color:#83928F;font-weight:570;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tag{font-size:10px;color:#477366;background:#EAF4EE;padding:5px 8px;border-radius:7px;flex-shrink:0}.tag.late{color:#B56B44;background:#FFF0E6}.item-name{font-size:16px;font-weight:720;letter-spacing:-.15px;line-height:1.5;margin-top:10px;overflow-wrap:anywhere}.item-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;gap:12px}.item-foot span{font-size:11px;color:#98A49F}.complete{border:0;background:#EAF3EF;color:#25675B;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700;white-space:nowrap}.item-click{cursor:pointer}.empty{margin:12px 0 0;background:#fff;border:1px dashed #D8E4DE;border-radius:20px;text-align:center;padding:38px 18px 35px}.empty-icon{margin:0 auto 11px;background:#EDF5EF;color:#43786A;width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:26px}.empty h3{font-size:17px;margin:0 0 7px}.empty p{font-size:13px;line-height:1.7;color:#81908C;margin:0 0 18px}.primary{background:#256B60;color:#fff;border:0;border-radius:12px;font-size:13px;font-weight:720;padding:12px 17px}.secondary{background:#F1F6F2;color:#326A5F;border:0;border-radius:12px;font-size:13px;font-weight:690;padding:12px 17px}.upcoming{background:#fff;padding:17px 17px 14px;border-radius:16px;border:1px solid var(--border);margin-top:12px}.upcoming-title{font-size:12px;font-weight:720;color:#516A62}.upcoming-row{display:flex;gap:8px;justify-content:space-between;margin-top:14px}.day{flex:1;text-align:center;background:#F5F8F4;border-radius:10px;padding:10px 0}.day b{display:block;font-size:18px;color:#3F635A;font-weight:720}.day small{font-size:10px;color:#9AA8A0}.tip{font-size:12px;line-height:1.85;color:#8B9995;margin:17px 3px 0}.tip b{color:#586F67}.nav{position:fixed;z-index:12;bottom:0;left:0;right:0;background:#FFFFFFEE;backdrop-filter:blur(16px);border-top:1px solid #E6EAE6;padding:11px 19px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:50px}.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:86px;color:#9BA9A3;font-size:11px;font-weight:700}.nav svg{height:22px;width:22px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round;stroke-linecap:round}.nav button.active{color:#246B60}.page-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 15px}.page-head h1{margin:0;font-size:25px;letter-spacing:-.75px}.content-note{color:#8D9A96;font-size:12px;margin:0 0 20px;line-height:1.75}.lib-entry{background:#fff;border:1px solid #E8EDE9;padding:15px;border-radius:16px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:14px}.lib-entry-info{flex:1;min-width:0}.lib-entry h3{font-size:14px;margin:7px 0 6px;line-height:1.45;overflow-wrap:anywhere}.lib-entry p{color:#8A9894;font-size:11px;margin:0}.lib-edit{border:0;background:#F4F7F4;color:#507068;border-radius:9px;padding:8px 10px;font-size:12px;flex-shrink:0}.search{border:1px solid #E4EBE6;border-radius:12px;background:white;font-size:14px;padding:12px 14px;width:100%;margin-bottom:14px}.group-label{font-size:12px;color:#788E83;margin:20px 1px 9px;font-weight:750}.sheet-veil{position:fixed;z-index:40;inset:0;background:#11292088;display:none;align-items:flex-end;justify-content:center}.sheet-veil.show{display:flex}.sheet{background:#fff;width:100%;max-width:540px;border-radius:25px 25px 0 0;max-height:min(88dvh,900px);overflow:auto;padding:10px 21px calc(25px + env(safe-area-inset-bottom));animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:translateY(0);opacity:1}}.handle{width:36px;height:5px;border-radius:9px;background:#E7ECE8;margin:0 auto 23px}.sheet-h{font-size:21px;font-weight:780;margin:0 0 7px;letter-spacing:-.4px}.sheet-sub{color:#8C9995;font-size:12px;line-height:1.6;margin:0 0 20px}.field-label{color:#526B62;display:block;font-size:12px;font-weight:760;margin:18px 0 8px}.form-input{width:100%;border:1px solid #DFE7E0;border-radius:12px;padding:13px;font-size:15px;background:#FBFCFA;color:#203C35;min-height:48px}.form-input:focus{border-color:#75A993;box-shadow:0 0 0 2px #DBEBE0}textarea.form-input{min-height:124px;resize:vertical;line-height:1.7}.seg{display:flex;gap:8px}.seg button{flex:1;border-radius:12px;border:1px solid #E4ECE6;background:#fff;padding:12px;font-size:13px;font-weight:700;color:#81948A}.seg button.active{border-color:#2D7A6B;color:#246B60;background:#EAF5EE}.sheet-actions{display:flex;gap:9px;margin-top:24px}.sheet-actions button{flex:1;min-height:47px}.review-info{margin-bottom:13px;color:#899892;font-size:12px}.review-title{font-size:24px;font-weight:800;line-height:1.4;margin:0 0 19px;overflow-wrap:anywhere}.prompt-box{background:#F2F7F3;border:1px solid #E6F1E8;border-radius:15px;padding:15px;color:#537066;font-size:13px;line-height:1.95;margin-bottom:21px}.grade-title{font-size:12px;font-weight:740;color:#526E62;margin-bottom:10px}.grade-option{display:flex;width:100%;border:1px solid #E6EDE7;background:white;color:#365249;border-radius:13px;padding:14px 15px;margin:9px 0;align-items:center;justify-content:space-between;font-size:14px;font-weight:680}.grade-option small{font-size:11px;color:#98A69F;font-weight:550}.grade-option.good{background:#E8F4ED;border-color:#D1EBDD;color:#266B59}.grade-option.fuzzy{background:#FFF7EE;color:#9D693E;border-color:#F5E5D3}.grade-option.forgot{color:#A46060}.danger{background:#FFF0EE;color:#B55252;border:0;border-radius:12px;padding:11px 14px}.divider{height:1px;background:#ECF0EC;margin:20px 0}.info-label{font-size:12px;color:#96A29D;font-weight:650;margin-bottom:7px}.info-value{font-size:14px;line-height:1.8;color:#446157}.file-btn{display:block;position:relative;overflow:hidden;text-align:center;background:#F1F6F2;color:#326A5F;border:0;border-radius:12px;font-size:13px;font-weight:690;padding:12px 17px}.file-btn input{position:absolute;inset:0;width:100%;opacity:0}.toast{position:fixed;z-index:70;left:50%;bottom:calc(93px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#183E37;color:white;padding:12px 19px;border-radius:12px;white-space:nowrap;font-size:13px;box-shadow:0 10px 20px #092D2444;display:none}.simple-empty{padding:45px 10px;text-align:center;color:#95A39B;font-size:13px}.hidden{display:none!important}@media(min-width:541px){.nav{width:540px;left:50%;transform:translateX(-50%);border-left:1px solid #eee;border-right:1px solid #eee}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}*{transition:none!important}}

<div class="app">
<header><div class="brand"><div class="logo">∑</div><div><strong>回溯</strong><small>MATH · PHYSICS</small></div></div><button class="roundbtn" id="settings-btn" aria-label="设置和备份"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2 2-.06-.06A1.7 1.7 0 0 0 15.9 18l-1 .4a1.7 1.7 0 0 0-1 1.56V21h-2v-1.05a1.7 1.7 0 0 0-1-1.56l-1-.4a1.7 1.7 0 0 0-1.84.38L8 18.44l-2-2 .06-.06A1.7 1.7 0 0 0 6.4 14.5L6 13.5a1.7 1.7 0 0 0-1.56-1H3.4v-2h1.04a1.7 1.7 0 0 0 1.56-1l.4-1a1.7 1.7 0 0 0-.34-1.88L6 6.56l2-2 .06.06A1.7 1.7 0 0 0 9.9 5l1-.4a1.7 1.7 0 0 0 1-1.56V2h2v1.04a1.7 1.7 0 0 0 1 1.56l1 .4a1.7 1.7 0 0 0 1.84-.38L18 4.56l2 2-.06.06A1.7 1.7 0 0 0 19.6 8.5l.4 1a1.7 1.7 0 0 0 1.56 1h1.04v2h-1.04a1.7 1.7 0 0 0-1.56 1L19.4 15Z"/></svg></button></header>
<main id="today-screen" class="screen active">

<script>
(()=>{'use strict';
const STORE='huishu-math-physics-v2',SCHEDULE=[1,3,7,14,30,60,120,240,365],DAY=86400000;
let data={version:2,items:[],logs:[]},filter='全部',view='today',activeId=null,editingId=null;
const $=x=>document.querySelector(x);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayNum=s=>{let [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/DAY};
const advance=(s,n)=>{let [y,m,d]=s.split('-').map(Number);let x=new Date(Date.UTC(y,m-1,d+n));return `${x.getUTCFullYear()}-${pad(x.getUTCMonth()+1)}-${pad(x.getUTCDate())}`};
const fmt=s=>{if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return '未安排';let a=s.split('-');return `${+a[1]}月${+a[2]}日`};
const uid=()=> (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
const escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const normalize=x=>({id:String(x.id||uid()),subject:x.subject==='物理'?'物理':'数学',chapter:String(x.chapter||'未分类').trim()||'未分类',title:String(x.title||x.chapter||'未分类').trim()||'未分类',due:/^\d{4}-\d{2}-\d{2}$/.test(x.due)?x.due:today(),stage:clamp(Number(x.stage)||0,0,SCHEDULE.length-1),lastReviewed:x.lastReviewed||'',reviews:Math.max(0,Number(x.reviews)||0),created:x.created||today()});
function load(){try{let a=JSON.parse(localStorage.getItem(STORE)||'null');if(a&&Array.isArray(a.items)){data.items=a.items.map(normalize);data.logs=Array.isArray(a.logs)?a.logs.filter(x=>x&&x.date):[]}}catch(e){console.error(e)} if(!data.items.length){try{const old=JSON.parse(localStorage.getItem('shuli-review-v1')||'null');if(old&&Array.isArray(old.items)&&old.items.length){data.items=old.items.map(x=>normalize({...x,stage:clamp(Number(x.streak)||0,0,8)}));data.logs=old.logs||[];save()}}catch(e){}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('浏览器无法储存数据。请使用 Safari 中的网站地址打开，不要使用临时预览模式。')}}
function toast(s){let n=$('#toast');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2300)}
const due=()=>data.items.filter(x=>x.due<=today()).sort((a,b)=>a.due.localeCompare(b.due)||a.subject.localeCompare(b.subject)||a.chapter.localeCompare(b.chapter));
const done=()=>new Set(data.logs.filter(x=>x.date===today()).map(x=>x.id));
function switchView(v){view=v;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+v+'-screen').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();window.scrollTo(0,0)}
function render(){renderToday();renderLibrary()}
function renderToday(){const now=new Date();const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];$('#date-line').textContent=`${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;const all=due(),completed=done(),total=all.length+completed.size,late=all.filter(x=>x.due<today()).length;$('#due-number').textContent=all.length;$('#progress').style.width=(total?Math.round(completed.size/total*100):100)+'%';$('#progress-label').textContent=total?`今日已完成 ${completed.size} / ${total}`:'今天的任务已经清空';$('#overdue-label').textContent=late?`含 ${late} 项逾期`:'按计划回顾';$('#today-total').textContent=all.length?`${all.length} 项待完成`:'';const rows=all.filter(x=>filter==='全部'||x.subject===filter);$('#today-list').innerHTML=rows.map(x=>`<article class="item item-click" data-review="${escape(x.id)}"><div class="item-top"><span class="item-path">${escape(x.subject)} / ${escape(x.chapter)}</span><span class="tag ${x.due<today()?'late':''}">${x.due<today()?`逾期 ${dayNum(today())-dayNum(x.due)} 天`:'今天'}</span></div><div class="item-name">${escape(x.title)}</div><div class="item-foot"><span>${x.reviews?`已复习 ${x.reviews} 次`:'首次回顾'}</span><button class="complete" data-review="${escape(x.id)}">回顾完成 →</button></div></article>`).join('') || `<div class="empty"><div class="empty-icon">✓</div><h3>${data.items.length?'当前没有到期内容':'从第一章开始'}</h3><p>${data.items.length?'无需额外刷题或提前复习，按计划进行即可。':'录入章节或知识点，软件会自动安排每天的复习清单。'}</p><button class="primary" data-empty-action>${data.items.length?'查看知识目录':'添加第一章'}</button></div>`;
const upcoming=[];for(let d=1;d<=5;d++){const date=advance(today(),d),n=data.items.filter(x=>x.due===date).length;upcoming.push(`<div class="day"><b>${n}</b><small>${d===1?'明天':fmt(date)}</small></div>`)}$('#upcoming').innerHTML=data.items.length?`<div class="upcoming"><div class="upcoming-title">接下来 5 天</div><div class="upcoming-row">${upcoming.join('')}</div></div>`:''}
function renderLibrary(){const search=$('#lib-search').value.trim().toLowerCase();const items=data.items.filter(x=>(x.title+x.chapter+x.subject).toLowerCase().includes(search)).sort((a,b)=>a.subject.localeCompare(b.subject)||a.chapter.localeCompare(b.chapter)||a.title.localeCompare(b.title));if(!items.length){$('#library-list').innerHTML=`<div class="simple-empty">${data.items.length?'没有匹配的内容':'知识库还是空的，点击右上角录入即可。'}</div>`;return}const groups=new Map;for(let i of items){const k=i.subject+' · '+i.chapter;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)}$('#library-list').innerHTML=[...groups].map(([label,rows])=>`<div class="group-label">${escape(label)} · ${rows.length}</div>${rows.map(i=>`<div class="lib-entry"><div class="lib-entry-info"><h3>${escape(i.title)}</h3><p>下次：${fmt(i.due)}${i.due<=today()?' · 已到期':''}　已复习 ${i.reviews} 次</p></div><button class="lib-edit" data-edit="${escape(i.id)}">编辑</button></div>`).join('')}`).join('')}
function open(html){$('#sheet').innerHTML='<div class="handle"></div>'+html;$('#veil').classList.add('show');document.body.style.overflow='hidden'}
function close(){document.body.style.overflow='';$('#veil').classList.remove('show');activeId=null;editingId=null}
function addSheet(){editingId=null;open(`<h2 class="sheet-h">录入学习内容</h2><p class="sheet-sub">章节和知识点均可作为复习单元，尽量按“能独立回想一次”的粒度拆分。</p><form id="add-form"><label class="field-label">学科</label><div class="seg" id="subject-seg"><button type="button" class="active" data-subject="数学">数学</button><button type="button" data-subject="物理">物理</button></div><label class="field-label" for="add-chapter">章节名称</label><input id="add-chapter" class="form-input" placeholder="例如：微分中值定理" autocomplete="off" required maxlength="120"><label class="field-label" for="add-points">知识点（可选，每行一个）</label><textarea id="add-points" class="form-input" placeholder="罗尔定理\n拉格朗日中值定理\n柯西中值定理"></textarea><p class="sheet-sub" style="margin:8px 0 0">留空则把整个章节作为一个复习项目。</p><label class="field-label">首次复习</label><div class="seg" id="date-seg"><button type="button" class="active" data-date="0">今天</button><button type="button" data-date="1">明天</button></div><div class="sheet-actions"><button type="button" class="secondary" data-close>取消</button><button class="primary" type="submit">加入复习计划</button></div></form>`)}
function reviewSheet(id){const i=data.items.find(x=>x.id===id);if(!i)return;activeId=id;open(`<div class="review-info">${escape(i.subject)} · ${escape(i.chapter)}</div><h2 class="review-title">${escape(i.title)}</h2><div class="prompt-box">先合上教材，尝试独立回想：<br>① 核心结论及其适用条件<br>② 推导的关键衔接<br>③ 典型应用或常见易错点<br><span style="font-size:11px;opacity:.77">不要求每次完整重推；遇到遗忘再翻教材核对。</span></div><div class="grade-title">本次回顾的实际情况</div><button class="grade-option good" data-grade="good"><span>记得，能独立回想</span><small>延长间隔 →</small></button><button class="grade-option fuzzy" data-grade="fuzzy"><span>有点模糊</span><small>较快再复习 →</small></button><button class="grade-option forgot" data-grade="forgot"><span>忘了，需要看教材</span><small>明天重试 →</small></button><div class="sheet-actions"><button class="secondary" data-close>暂不记录</button></div>`)}
function grade(g){let i=data.items.find(x=>x.id===activeId);if(!i)return;let days=1;if(g==='good'){days=SCHEDULE[i.stage];i.stage=clamp(i.stage+1,0,SCHEDULE.length-1)}else if(g==='fuzzy'){const prev=SCHEDULE[Math.max(0,i.stage-1)];days=Math.max(1,Math.round(prev*.4));i.stage=clamp(i.stage-1,0,SCHEDULE.length-1)}else{i.stage=0;days=1}i.due=advance(today(),days);i.lastReviewed=today();i.reviews+=1;data.logs.push({date:today(),id:i.id,grade:g});if(data.logs.length>12000)data.logs=data.logs.slice(-10000);save();close();render();toast(`已安排 ${days} 天后复习`)}
function editSheet(id){let i=data.items.find(x=>x.id===id);if(!i)return;editingId=id;open(`<h2 class="sheet-h">编辑复习项目</h2><p class="sheet-sub">${escape(i.subject)} · ${escape(i.chapter)}</p><form id="edit-form"><label class="field-label">知识点或章节名称</label><input id="edit-title" required class="form-input" value="${escape(i.title)}" maxlength="150"><label class="field-label">所属章节</label><input id="edit-chapter" required class="form-input" value="${escape(i.chapter)}"><label class="field-label">下次复习日期</label><input id="edit-date" class="form-input" type="date" value="${escape(i.due)}"><div class="sheet-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary" type="submit">保存</button></div></form><div class="divider"></div><button class="danger" data-delete="${escape(i.id)}">删除这个项目</button>`)}
function settings(){open(`<h2 class="sheet-h">设置与数据</h2><p class="sheet-sub">这个版本只提供每天该复习的清单。不会强迫打卡，也不会自动生成习题。</p><div class="info-label">记忆调度</div><div class="info-value">独立回忆成功后，复习间隔依次延长为 1、3、7、14、30、60、120、240、365 天。模糊则缩短间隔，忘记则明天再复习。<br><br>依据间隔效应、提取练习原理；这是可解释的自适应规则，不是经过个体记忆数据拟合的最优间隔模型。</div><div class="divider"></div><div class="info-label">数据保存</div><div class="info-value">所有知识点和复习记录只保存在当前网站的本机浏览器里。换手机或清除 Safari 数据前，请导出备份。</div><div class="sheet-actions"><button class="primary" data-export>导出备份</button><label class="file-btn" style="flex:1">恢复备份<input type="file" id="restore-file" accept=".json,application/json"></label></div><div class="divider"></div><div class="info-label">使用方式</div><div class="info-value">在 iPhone Safari 打开此网站 → 分享 → 添加到主屏幕。若需要手机锁屏提醒，可继续使用每天固定时间的日历或 ChatGPT 提醒；网页本身不能在后台推送动态清单。</div>`)}
function backup(){const json=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='回溯备份-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已导出备份')}
function restore(f){const reader=new FileReader;reader.onload=()=>{try{const raw=JSON.parse(String(reader.result||''));if(!raw||!Array.isArray(raw.items))throw new Error('备份内没有知识点');if(!confirm(`恢复 ${raw.items.length} 个知识点？当前数据将被覆盖，建议先导出备份。`))return;const ids=new Set();let items=raw.items.map(normalize).filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true});data={version:2,items,logs:Array.isArray(raw.logs)?raw.logs.filter(x=>x&&x.date&&ids.has(x.id)):[]};save();close();render();toast(`已恢复 ${items.length} 个知识点`)}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(f,'UTF-8')}
$('#settings-btn').onclick=settings;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderToday()});$('#add-btn').onclick=addSheet;$('#lib-search').oninput=renderLibrary;
$('#today-list').onclick=e=>{const b=e.target.closest('[data-review]');if(b)reviewSheet(b.dataset.review);else if(e.target.closest('[data-empty-action]')){if(!data.items.length)addSheet();else switchView('library')}};
$('#library-list').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)editSheet(b.dataset.edit)};
$('#veil').onclick=e=>{if(e.target===$('#veil')||e.target.closest('[data-close]'))return close();let b=e.target.closest('[data-subject]');if(b){document.querySelectorAll('[data-subject]').forEach(x=>x.classList.toggle('active',x===b));return}b=e.target.closest('[data-date]');if(b){document.querySelectorAll('[data-date]').forEach(x=>x.classList.toggle('active',x===b));return}b=e.target.closest('[data-grade]');if(b)return grade(b.dataset.grade);b=e.target.closest('[data-delete]');if(b){if(!confirm('删除该项目及相关复习历史？'))return;data.items=data.items.filter(x=>x.id!==b.dataset.delete);data.logs=data.logs.filter(x=>x.id!==b.dataset.delete);save();close();render();toast('已删除')}if(e.target.closest('[data-export]'))backup()};
$('#sheet').onsubmit=e=>{e.preventDefault();if(e.target.id==='add-form'){const subj=$('[data-subject].active').dataset.subject;let ch=$('#add-chapter').value.trim(),raw=$('#add-points').value.trim();if(!ch)return;let titles=raw?raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[ch];const start=advance(today(),Number($('[data-date].active').dataset.date));let existing=new Set(data.items.map(x=>[x.subject,x.chapter,x.title].join('\u0000'))),added=0;for(let t of titles){const key=[subj,ch,t].join('\u0000');if(existing.has(key))continue;existing.add(key);data.items.push(normalize({subject:subj,chapter:ch,title:t,due:start}));added++}save();close();switchView('today');toast(added?`已加入 ${added} 个复习项目`:'这些内容已存在')}else if(e.target.id==='edit-form'){let i=data.items.find(x=>x.id===editingId);if(!i)return;i.title=$('#edit-title').value.trim();i.chapter=$('#edit-chapter').value.trim();i.due=$('#edit-date').value||today();if(!i.title||!i.chapter)return;save();close();render();toast('已保存')}};
$('#sheet').onchange=e=>{if(e.target.id==='restore-file'&&e.target.files[0])restore(e.target.files[0])};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#veil').classList.contains('show'))close()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});load();render();
})();
</script>
</body>
</html>
