<script>
(()=>{'use strict';
const STORE='huishu-math-physics-v2',SCHEDULE=[1,3,7,14,30,60,120,240,365],DAY=86400000;
let data={version:3,items:[],logs:[]},filter='全部',view='today',activeId=null,editingId=null,selectedDate=null,calendarMonth=null,addSource='library';
const $=x=>document.querySelector(x);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{let d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayNum=s=>{let [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/DAY};
const advance=(s,n)=>{let [y,m,d]=s.split('-').map(Number);let x=new Date(Date.UTC(y,m-1,d+n));return `${x.getUTCFullYear()}-${pad(x.getUTCMonth()+1)}-${pad(x.getUTCDate())}`};
const fmt=s=>{if(!s||!/^\d{4}-\d\d-\d\d$/.test(s))return '未安排';let a=s.split('-');return `${+a[1]}月${+a[2]}日`};
const uid=()=> (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2,10)}`;
const escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const validDate=s=>{if(typeof s!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(s))return false;const y=Number(s.slice(0,4)),m=Number(s.slice(5,7)),d=Number(s.slice(8,10));if(y<1900||y>9999)return false;const v=new Date(Date.UTC(y,m-1,d));return v.getUTCFullYear()===y&&v.getUTCMonth()===m-1&&v.getUTCDate()===d};
const uniqueDays=a=>[...new Set(a.filter(validDate))].sort();
const normalize=x=>{const created=validDate(x.created)?x.created:today(),initial=validDate(x.learnedAt)?x.learnedAt:created,studyDates=uniqueDays(Array.isArray(x.studyDates)?x.studyDates:[initial]);if(!studyDates.length)studyDates.push(initial);return {id:String(x.id||uid()),subject:x.subject==='物理'?'物理':'数学',chapter:String(x.chapter||'未分类').trim()||'未分类',title:String(x.title||x.chapter||'未分类').trim()||'未分类',due:validDate(x.due)?x.due:advance(studyDates[studyDates.length-1],1),stage:clamp(Number(x.stage)||0,0,SCHEDULE.length-1),lastReviewed:validDate(x.lastReviewed)?x.lastReviewed:'',reviews:Math.max(0,Number(x.reviews)||0),created,learnedAt:studyDates[0],studyDates}};
function load(){try{let a=JSON.parse(localStorage.getItem(STORE)||'null');if(a&&Array.isArray(a.items)){data.items=a.items.map(normalize);data.logs=Array.isArray(a.logs)?a.logs.filter(x=>x&&x.date):[];if(a.version!==3||a.items.some(x=>!Array.isArray(x.studyDates)))save()}}catch(e){console.error(e)} if(!data.items.length){try{const old=JSON.parse(localStorage.getItem('shuli-review-v1')||'null');if(old&&Array.isArray(old.items)&&old.items.length){data.items=old.items.map(x=>normalize({...x,stage:clamp(Number(x.streak)||0,0,8)}));data.logs=old.logs||[];save()}}catch(e){}}}
function save(){try{localStorage.setItem(STORE,JSON.stringify(data))}catch(e){alert('浏览器无法储存数据。请使用 Safari 中的网站地址打开，不要使用临时预览模式。')}}
function toast(s){let n=$('#toast');n.textContent=s;n.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>n.style.display='none',2300)}
const due=()=>data.items.filter(x=>x.due<=today()).sort((a,b)=>a.due.localeCompare(b.due)||a.subject.localeCompare(b.subject)||a.chapter.localeCompare(b.chapter));
const done=()=>new Set(data.logs.filter(x=>x.date===today()).map(x=>x.id));
function switchView(v){view=v;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+v+'-screen').classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));render();window.scrollTo(0,0)}
function render(){renderToday();renderLibrary();renderCalendar()}
function renderToday(){const now=new Date();const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];$('#date-line').textContent=`${now.getMonth()+1}月${now.getDate()}日 · ${weekdays[now.getDay()]}`;const all=due(),completed=done(),total=all.length+completed.size,late=all.filter(x=>x.due<today()).length;$('#due-number').textContent=all.length;$('#progress').style.width=(total?Math.round(completed.size/total*100):100)+'%';$('#progress-label').textContent=total?`今日已完成 ${completed.size} / ${total}`:'今天的任务已经清空';$('#overdue-label').textContent=late?`含 ${late} 项逾期`:'按计划回顾';$('#today-total').textContent=all.length?`${all.length} 项待完成`:'';const rows=all.filter(x=>filter==='全部'||x.subject===filter);$('#today-list').innerHTML=rows.map(x=>`<article class="item item-click" data-review="${escape(x.id)}"><div class="item-top"><span class="item-path">${escape(x.subject)} / ${escape(x.chapter)}</span><span class="tag ${x.due<today()?'late':''}">${x.due<today()?`逾期 ${dayNum(today())-dayNum(x.due)} 天`:'今天'}</span></div><div class="item-name">${escape(x.title)}</div><div class="item-foot"><span>${x.reviews?`已复习 ${x.reviews} 次`:'首次回顾'}</span><button class="complete" data-review="${escape(x.id)}">回忆 / 应用 →</button></div></article>`).join('') || `<div class="empty"><div class="empty-icon">✓</div><h3>${data.items.length?'当前没有到期内容':'从第一章开始'}</h3><p>${data.items.length?'无需额外刷题或提前复习，按计划进行即可。':'录入章节或知识点，软件会自动安排每天的复习清单。'}</p><button class="primary" data-empty-action>${data.items.length?'查看知识目录':'添加第一章'}</button></div>`;
const upcoming=[];for(let d=1;d<=5;d++){const date=advance(today(),d),n=data.items.filter(x=>x.due===date).length;upcoming.push(`<div class="day"><b>${n}</b><small>${d===1?'明天':fmt(date)}</small></div>`)}$('#upcoming').innerHTML=data.items.length?`<div class="upcoming"><div class="upcoming-title">接下来 5 天</div><div class="upcoming-row">${upcoming.join('')}</div></div>`:''}
function renderLibrary(){const search=$('#lib-search').value.trim().toLowerCase();const items=data.items.filter(x=>(x.title+x.chapter+x.subject).toLowerCase().includes(search)).sort((a,b)=>a.subject.localeCompare(b.subject)||a.chapter.localeCompare(b.chapter)||a.title.localeCompare(b.title));if(!items.length){$('#library-list').innerHTML=`<div class="simple-empty">${data.items.length?'没有匹配的内容':'知识库还是空的，点击右上角录入即可。'}</div>`;return}const groups=new Map;for(let i of items){const k=i.subject+' · '+i.chapter;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)}$('#library-list').innerHTML=[...groups].map(([label,rows])=>`<div class="group-label">${escape(label)} · ${rows.length}</div>${rows.map(i=>`<div class="lib-entry"><div class="lib-entry-info"><h3>${escape(i.title)}</h3><p>学于：${fmt(i.learnedAt)} · 下次：${fmt(i.due)}${i.due<=today()?' · 已到期':''} · 复习 ${i.reviews} 次</p></div><button class="lib-edit" data-edit="${escape(i.id)}">编辑</button></div>`).join('')}`).join('')}
function renderCalendar(){
 if(!selectedDate)selectedDate=today();if(!calendarMonth)calendarMonth=selectedDate.slice(0,7);
 const [y,m]=calendarMonth.split('-').map(Number),start=new Date(y,m-1,1),first=start.getDay(),length=new Date(y,m,0).getDate();
 $('#cal-month').textContent=`${y}年 ${m}月`;
 const studyCounts=new Map(),reviewCounts=new Map();for(const i of data.items){for(const d of i.studyDates)studyCounts.set(d,(studyCounts.get(d)||0)+1);reviewCounts.set(i.due,(reviewCounts.get(i.due)||0)+1)}
 const cells=[];for(let k=0;k<Math.ceil((first+length)/7)*7;k++){
  const dt=new Date(y,m-1,k-first+1),d=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const out=dt.getMonth()!==m-1,st=studyCounts.get(d)||0,rev=reviewCounts.get(d)||0;
  cells.push(`<button type="button" class="cal-cell ${out?'out':''} ${d===selectedDate?'selected':''} ${d===today()?'today':''}" data-cal-date="${d}" aria-label="${escape(d)}，学习${st}项，计划复习${rev}项" aria-pressed="${d===selectedDate}"><span>${dt.getDate()}</span><span class="cal-marks">${st?'<i class="cal-dot"></i>':''}${rev?'<i class="cal-dot plan"></i>':''}</span></button>`)
 }
 $('#cal-grid').innerHTML=cells.join('');
 $('#cal-date-title').textContent=`${fmt(selectedDate)} · 当日学习`;
 const future=selectedDate>today();$('#cal-add').disabled=future;$('#cal-add-top').disabled=future;
 const learned=data.items.filter(i=>i.studyDates.includes(selectedDate)).sort((a,b)=>a.subject.localeCompare(b.subject)||a.chapter.localeCompare(b.chapter));
 const dueItems=data.items.filter(i=>i.due===selectedDate);
 let html=learned.length?learned.map(i=>`<div class="cal-entry"><div><b>${escape(i.title)}</b><small>${escape(i.subject)} · ${escape(i.chapter)} · 下次${fmt(i.due)}</small></div><button data-cal-edit="${escape(i.id)}">编辑</button></div>`).join(''):`<div class="cal-empty">${future?'未来日期尚不能登记学习内容':'这天还没有学习记录。'}${future?'':'<br>点击“添加学习内容”即可补录。'}</div>`;
 if(dueItems.length)html+=`<div class="cal-preview">${selectedDate>today()?'按当前计划，':'记录中，'}这天有 ${dueItems.length} 项${selectedDate>today()?'待':'计划'}复习。计划会随实际回忆情况调整。</div>`;
 $('#cal-day-detail').innerHTML=html;
}
function calendarMove(offset){const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+offset,1);calendarMonth=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;selectedDate=calendarMonth+'-01';renderCalendar()}
function recordStudy(item,date){if(item.studyDates.includes(date))return false;const previousLatest=item.studyDates[item.studyDates.length-1];item.studyDates=uniqueDays([...item.studyDates,date]);item.learnedAt=item.studyDates[0];
 // 只对没有后续复习记录的最新一次学习重排；补录更早日期不覆盖已经完成的复习。
 if(date>=previousLatest && (!item.lastReviewed||date>item.lastReviewed)) {item.stage=1;item.due=advance(date,1)}
 return true;
}
function open(html){$('#sheet').innerHTML='<div class="handle"></div>'+html;$('#veil').classList.add('show');document.body.style.overflow='hidden'}
function close(){document.body.style.overflow='';$('#veil').classList.remove('show');activeId=null;editingId=null}
function addSheet(source){editingId=null;addSource=source==='calendar'?'calendar':'library';const initial=addSource==='calendar'?(selectedDate||today()):today();open(`<h2 class="sheet-h">录入学习内容</h2><p class="sheet-sub">章节和知识点均可作为复习单元，尽量按“能独立回想一次”的粒度拆分。</p><form id="add-form"><label class="field-label">学科</label><div class="seg" id="subject-seg"><button type="button" class="active" data-subject="数学">数学</button><button type="button" data-subject="物理">物理</button></div><label class="field-label" for="add-chapter">章节名称</label><input id="add-chapter" class="form-input" placeholder="例如：微分中值定理" autocomplete="off" required maxlength="120"><label class="field-label" for="add-points">知识点（可选，每行一个）</label><textarea id="add-points" class="form-input" placeholder="罗尔定理\n拉格朗日中值定理\n柯西中值定理"></textarea><p class="sheet-sub" style="margin:8px 0 0">留空则把整个章节作为一个复习项目。</p><label class="field-label" for="add-learning-date">实际学习日期</label><input id="add-learning-date" class="form-input" type="date" max="${today()}" value="${initial}" required><p class="sheet-sub" style="margin:7px 0 0">首次复习默认安排在学习次日。若该内容已经学过，重复记录也可以。</p><div class="sheet-actions"><button type="button" class="secondary" data-close>取消</button><button class="primary" type="submit">加入复习计划</button></div></form>`)}
function reviewSheet(id){const i=data.items.find(x=>x.id===id);if(!i)return;activeId=id;const questions=i.subject==='数学'?['它解决哪类问题？前提和适用条件是什么？','推导或证明从哪里切入，关键衔接为什么成立？','面对哪种题目应该想到它？与相近方法如何区分？']:['研究对象、物理含义和成立的假设是什么？','关键模型或方程怎样建立，为什么这样处理？','什么情境下能用这种方法，适用范围与限制是什么？'];open(`<div class="review-info">${escape(i.subject)} · ${escape(i.chapter)}</div><h2 class="review-title">${escape(i.title)}</h2><div class="prompt-box"><b>回忆理解与方法，而不是背诵</b><br>① ${questions[0]}<br>② ${questions[1]}<br>③ ${questions[2]}<br><span style="font-size:11px;opacity:.77">先短暂独立思考；有断点就核对教材，不要求逐字复述或完整重推。</span></div><div class="grade-title">这次的真实掌握情况</div><button class="grade-option good" data-grade="good"><span>能解释并重建主要思路</span><small>延长间隔 →</small></button><button class="grade-option good" data-grade="applied"><span>做题时已独立选用并解释</span><small>算作有效复习 →</small></button><button class="grade-option fuzzy" data-grade="fuzzy"><span>有理解断点或方法想不起来</span><small>较快复习 →</small></button><button class="grade-option forgot" data-grade="forgot"><span>需要翻教材重新理解</span><small>明天再检验 →</small></button><div class="sheet-actions"><button class="secondary" data-close>暂不记录</button></div>`)}
function grade(g){let i=data.items.find(x=>x.id===activeId);if(!i)return;let days=1;if(g==='good'||g==='applied'){days=SCHEDULE[i.stage];i.stage=clamp(i.stage+1,0,SCHEDULE.length-1)}else if(g==='fuzzy'){const prev=SCHEDULE[Math.max(0,i.stage-1)];days=Math.max(1,Math.round(prev*.4));i.stage=clamp(i.stage-1,0,SCHEDULE.length-1)}else{i.stage=0;days=1}i.due=advance(today(),days);i.lastReviewed=today();i.reviews+=1;data.logs.push({date:today(),id:i.id,grade:g});if(data.logs.length>12000)data.logs=data.logs.slice(-10000);save();close();render();toast(`已安排 ${days} 天后复习`)}
function editSheet(id){let i=data.items.find(x=>x.id===id);if(!i)return;editingId=id;open(`<h2 class="sheet-h">编辑复习项目</h2><p class="sheet-sub">${escape(i.subject)} · ${escape(i.chapter)}</p><form id="edit-form"><label class="field-label">知识点或章节名称</label><input id="edit-title" required class="form-input" value="${escape(i.title)}" maxlength="150"><label class="field-label">所属章节</label><input id="edit-chapter" required class="form-input" value="${escape(i.chapter)}"><label class="field-label">首次学习日期</label><input id="edit-learned" class="form-input" type="date" max="${today()}" value="${escape(i.learnedAt)}"><p class="sheet-sub" style="margin:7px 0 0">只修改最早的学习记录；已发生的复习不会被清空。</p><label class="field-label">下次复习日期</label><input id="edit-date" class="form-input" type="date" value="${escape(i.due)}"><div class="sheet-actions"><button class="secondary" type="button" data-close>取消</button><button class="primary" type="submit">保存</button></div></form><div class="divider"></div><button class="danger" data-delete="${escape(i.id)}">删除这个项目</button>`)}
function settings(){open(`<h2 class="sheet-h">设置与数据</h2><p class="sheet-sub">在日历上记录学习日期，系统根据实际学习与理解反馈生成复习清单。数理复习侧重概念、推导与方法，不要求背诵教材或另做笔记。</p><div class="info-label">记忆调度</div><div class="info-value">首次学习的次日安排第一次回忆；若回忆成功，之后的间隔依次为 3、7、14、30、60、120、240、365 天。模糊则缩短间隔，忘记则次日再试。做题中能独立选择、正确使用并解释相关方法，也可以记录为一次有效复习；单纯照着例题套用不算。补录较早日期不会覆盖已经完成的复习。<br><br>依据间隔效应、提取练习原理；这是可解释的自适应规则，不是经过个体记忆数据拟合的最优间隔模型。</div><div class="divider"></div><div class="info-label">数据保存</div><div class="info-value">学习日历、知识点和复习记录只保存在当前网站的本机浏览器里。旧版本数据会被保留；旧项目的学习日期暂按原录入日显示，可以手动修改。换手机或清除 Safari 数据前，请导出备份。</div><div class="sheet-actions"><button class="primary" data-export>导出备份</button><label class="file-btn" style="flex:1">恢复备份<input type="file" id="restore-file" accept=".json,application/json"></label></div><div class="divider"></div><div class="info-label">使用方式</div><div class="info-value">在 iPhone Safari 打开此网站 → 分享 → 添加到主屏幕。若需要手机锁屏提醒，可继续使用每天固定时间的日历或 ChatGPT 提醒；网页本身不能在后台推送动态清单。</div>`)}
function backup(){const json=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2),blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='回溯备份-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('已导出备份')}
function restore(f){const reader=new FileReader;reader.onload=()=>{try{const raw=JSON.parse(String(reader.result||''));if(!raw||!Array.isArray(raw.items))throw new Error('备份内没有知识点');if(!confirm(`恢复 ${raw.items.length} 个知识点？当前数据将被覆盖，建议先导出备份。`))return;const ids=new Set();let items=raw.items.map(normalize).filter(x=>{if(ids.has(x.id))return false;ids.add(x.id);return true});data={version:3,items,logs:Array.isArray(raw.logs)?raw.logs.filter(x=>x&&x.date&&ids.has(x.id)):[]};save();close();render();toast(`已恢复 ${items.length} 个知识点`)}catch(e){alert('导入失败：'+e.message)}};reader.readAsText(f,'UTF-8')}
$('#settings-btn').onclick=settings;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderToday()});$('#add-btn').onclick=()=>addSheet('library');$('#lib-search').oninput=renderLibrary;
$('#cal-add').onclick=()=>{if(selectedDate<=today())addSheet('calendar')};$('#cal-add-top').onclick=()=>{if(selectedDate<=today())addSheet('calendar')};
$('#cal-prev').onclick=()=>calendarMove(-1);$('#cal-next').onclick=()=>calendarMove(1);$('#cal-now').onclick=()=>{selectedDate=today();calendarMonth=today().slice(0,7);renderCalendar()};
$('#cal-grid').onclick=e=>{const btn=e.target.closest('[data-cal-date]');if(!btn)return;selectedDate=btn.dataset.calDate;calendarMonth=selectedDate.slice(0,7);renderCalendar()};
$('#cal-day-detail').onclick=e=>{const btn=e.target.closest('[data-cal-edit]');if(btn)editSheet(btn.dataset.calEdit)};
$('#today-list').onclick=e=>{const b=e.target.closest('[data-review]');if(b)reviewSheet(b.dataset.review);else if(e.target.closest('[data-empty-action]')){if(!data.items.length)addSheet('library');else switchView('library')}};
$('#library-list').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)editSheet(b.dataset.edit)};
$('#veil').onclick=e=>{if(e.target===$('#veil')||e.target.closest('[data-close]'))return close();let b=e.target.closest('[data-subject]');if(b){document.querySelectorAll('[data-subject]').forEach(x=>x.classList.toggle('active',x===b));return}b=e.target.closest('[data-grade]');if(b)return grade(b.dataset.grade);b=e.target.closest('[data-delete]');if(b){if(!confirm('删除该项目及相关复习历史？'))return;data.items=data.items.filter(x=>x.id!==b.dataset.delete);data.logs=data.logs.filter(x=>x.id!==b.dataset.delete);save();close();render();toast('已删除')}if(e.target.closest('[data-export]'))backup()};
$('#sheet').onsubmit=e=>{e.preventDefault();if(e.target.id==='add-form'){
 const subj=$('[data-subject].active').dataset.subject,ch=$('#add-chapter').value.trim(),raw=$('#add-points').value.trim(),studyDate=$('#add-learning-date').value;
 if(!ch||!validDate(studyDate)||studyDate>today()){toast('请选择有效的实际学习日期');return}
 const titles=raw?raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean):[ch];let added=0,restudied=0;
 for(const title of [...new Set(titles)]){
  let item=data.items.find(i=>i.subject===subj&&i.chapter===ch&&i.title===title);
  if(item){if(recordStudy(item,studyDate))restudied++}
  else{data.items.push(normalize({subject:subj,chapter:ch,title,created:today(),learnedAt:studyDate,studyDates:[studyDate],stage:1,due:advance(studyDate,1)}));added++}
 }
 save();const dest=addSource==='calendar'?'calendar':'today';selectedDate=studyDate;calendarMonth=studyDate.slice(0,7);close();switchView(dest);
 toast(added||restudied?`记录 ${added+restudied} 项，已安排复习`:'该日期已经有这些学习记录');
 }else if(e.target.id==='edit-form'){
  const i=data.items.find(x=>x.id===editingId);if(!i)return;
  const name=$('#edit-title').value.trim(),ch=$('#edit-chapter').value.trim(),newLearned=$('#edit-learned').value,enteredDue=$('#edit-date').value;
  if(!name||!ch||!validDate(newLearned)||newLearned>today()||!validDate(enteredDue)){toast('日期或名称无效');return}
  if(data.items.some(x=>x.id!==i.id&&x.subject===i.subject&&x.chapter===ch&&x.title===name)){toast('该知识点已存在');return}
  const learnedChanged=newLearned!==i.learnedAt;
  if(learnedChanged){i.studyDates=uniqueDays([newLearned,...i.studyDates.filter(d=>d!==i.learnedAt)]);i.learnedAt=i.studyDates[0]}
  i.title=name;i.chapter=ch;
  i.due=learnedChanged&&i.reviews===0&&enteredDue===i.due?advance(i.studyDates[i.studyDates.length-1],1):enteredDue;
  save();close();render();toast('已保存');
 }};
$('#sheet').onchange=e=>{if(e.target.id==='restore-file'&&e.target.files[0])restore(e.target.files[0])};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#veil').classList.contains('show'))close()});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});load();render();if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
})();
