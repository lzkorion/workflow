/* iOS-first responsive layout */
:root{-webkit-font-smoothing:antialiased;--accent:#84cfe6;--panel:#151e29;--border:#303c48}
html{height:100%;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
body{min-height:100%;overscroll-behavior-x:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation;min-height:44px}
button:active:not(:disabled){transform:scale(.985)}
input,select,textarea{font-size:16px;min-height:46px}
.content{min-width:0}
.practice-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}
.practice-title h1{margin:0;font-size:27px;font-weight:650}
.practice-title .eyebrow{margin:0 0 4px}
.practice-title .mini-progress{color:var(--muted);font-size:13px;white-space:nowrap}
.session-card.tap-ready{cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.session-card.tap-ready:active{border-color:#83cfe6}
.session-card .tap-tip{position:absolute;bottom:24px;left:0;right:0;pointer-events:none;color:#97adbc;font-size:13px}
.session-card.revealed-card{justify-content:center}
.grade-dock{margin-top:15px}
.grade-dock .grade-grid{margin:0}
.grade{min-height:69px}
.grade:active{background:#273947}
.spell-input{font-size:22px;min-height:52px;max-width:420px;border-radius:14px}
.session-card .term{overflow-wrap:anywhere}
.ios-note{display:flex;gap:12px;align-items:flex-start;border:1px solid #3a5363;background:#192c38;color:#d3e8ee;padding:13px 15px;border-radius:14px;font-size:12px;line-height:1.7;margin-top:15px}
.ios-note b{font-weight:650;color:#b0eafb}
.ios-note .note-icon{flex:none;font-size:19px;line-height:1.5}
.ios-note .note-text{min-width:0}
.pwa-tip{margin-top:15px;border-left:2px solid #496b79;padding-left:12px;line-height:1.8;font-size:13px;color:var(--muted)}
.settings-backup-buttons{display:flex;gap:10px;flex-wrap:wrap}
.swipe-nudge{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.tab-icon{display:grid;place-items:center;width:22px;height:22px;font-size:20px}
.navbtn,.mobile-nav button{transition:color .2s,background .2s}
@media(max-width:1024px){
 .app{display:block}
 aside{display:none}
 .mobile-nav{display:flex;position:fixed;inset:auto 0 0;align-items:center;justify-content:space-around;padding:7px max(9px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));z-index:10;border-top:1px solid #32414f;background:rgba(17,25,35,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
 .mobile-nav button{min-width:0;flex:1;display:flex;align-items:center;flex-direction:column;gap:2px;background:none;border:0;color:#91a0ae;font-size:11px;line-height:1.4;padding:5px 4px;border-radius:10px}
 .mobile-nav button.active{color:var(--accent)}
 .mobile-nav button span{font-size:20px;line-height:25px}
 .content{width:100%;max-width:870px;padding:28px 28px calc(104px + env(safe-area-inset-bottom))}
 .section-grid{grid-template-columns:1fr 1fr}
 .stats{grid-template-columns:repeat(4,minmax(0,1fr))}
 .session-card{min-height:min(49dvh,510px)}
}
@media(max-width:700px){
 .content{padding:22px 16px calc(118px + env(safe-area-inset-bottom))}
 .topline{margin-bottom:16px}
 .topline h1{font-size:29px;line-height:1.3}
 .topline .subhead{font-size:13px;line-height:1.6}
 .date-pill{display:none}
 .section-grid{grid-template-columns:1fr;gap:12px}
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}
 .stat{padding:13px 15px}
 .stat .num{font-size:26px}
 .stat .mini{font-size:11px}
 .panel{padding:18px}
 .panel h2{font-size:18px}
 .practice-title{margin-bottom:14px}
 .practice-title h1{font-size:24px}
 .session-header{margin:0 0 13px;gap:9px;flex-direction:column;align-items:stretch}
 .control-group{width:100%}
 .seg{width:100%;border-radius:13px;padding:4px}
 .seg button{flex:1;min-height:41px;font-size:13px;padding:7px 6px}
 .session-card{min-height:clamp(270px,39dvh,430px);padding:35px 19px;border-radius:22px}
 .session-card .term{font-size:clamp(34px,9vw,50px)}
 .session-card .term.cn{font-size:clamp(26px,7vw,39px)}
 .session-card .meaning{font-size:19px;overflow-wrap:anywhere}
 .session-card .example{font-size:13px;line-height:1.55;margin-top:10px}
 .session-card .tag{margin-bottom:15px}
 .session-card .tap-tip{bottom:18px}
 .grade-dock{position:fixed;left:0;right:0;bottom:calc(65px + env(safe-area-inset-bottom));z-index:8;padding:9px 14px 12px;background:linear-gradient(180deg,rgba(13,17,23,.85),rgba(13,17,23,.99) 22%);border-top:1px solid #2c3945}
 .grade-dock .grade-grid{gap:9px;grid-template-columns:repeat(4,minmax(0,1fr))}
 .grade{font-size:14px;padding:7px 3px;min-height:62px;border-radius:12px}
 .grade small{font-size:10px;margin-top:3px}
 .practice-page:has(.grade-dock){padding-bottom:96px}
 .button-row{margin-top:12px}
 .button-row .primary{min-height:50px;min-width:180px}
 .mode-hint{font-size:12px}
 .session-card .spell-input{width:100%;font-size:22px}
 .wordrow{grid-template-columns:minmax(0,1fr) auto;gap:7px}
 .wordrow .meaningcell{grid-column:1;grid-row:2}
 .wordrow .actioncell{grid-column:2;grid-row:1/3}
 .search-row input{min-width:100%}
 .search-row button{flex:1}
 .toast{left:16px;right:16px;bottom:calc(79px + env(safe-area-inset-bottom));max-width:none;text-align:center}
 .settings-row{gap:8px}
 .modal-body{padding:20px}
 dialog{max-height:calc(100dvh - 36px);border-radius:19px}
}
@media(max-width:360px){.content{padding-left:12px;padding-right:12px}.grade-dock{padding-left:7px;padding-right:7px}.grade-dock .grade-grid{gap:5px}.grade{font-size:13px}.grade small{font-size:9px}}
@media(max-height:720px) and (max-width:700px){
 .content{padding-top:12px}
 .session-card{min-height:240px;padding-top:18px;padding-bottom:22px}
 .session-card .tag{margin-bottom:10px}
 .session-card .tap-tip{bottom:8px}
 .session-header{margin-bottom:8px}
}
@media(max-width:1024px){body:has(input:focus) .mobile-nav,body:has(textarea:focus) .mobile-nav{display:none}}
@media(prefers-reduced-motion:reduce){button{transition:none!important}button:active{transform:none!important}}

/* 2026 双向间隔记忆优化 */
.extra-learning{margin-top:22px;border-top:1px solid var(--border);padding-top:15px}
.extra-learning label{display:block;color:var(--muted);font-size:13px;margin-bottom:9px}
.extra-learning .small-input{width:96px;min-height:43px;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px}
.extra-learning .secondary{min-height:43px}
.notice-missing{color:var(--orange);font-size:12px;margin:15px 0 0}
.spell-toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.spell-toggle input{width:17px;height:17px;accent-color:var(--accent)}
.two-way-note{margin:0 0 11px;color:var(--muted);font-size:12px}
.grade:disabled{opacity:.32;cursor:not-allowed}
@media(max-width:700px){.spell-toggle{max-width:100%;font-size:12px}.session-header{gap:12px}.extra-learning .flex{flex-wrap:nowrap}.extra-learning .secondary{font-size:12px;padding:9px 12px}}

/* FSRS-6: Home is the plan, not a dashboard. No charts, streaks, rewards. */
.today-summary{font-size:13px;color:var(--muted);margin:-11px 0 18px}
.today-summary strong{color:var(--text);font-weight:650}
.today-plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;align-items:start}
.today-plan{padding:25px 23px 21px;display:flex;flex-direction:column;gap:0}
.today-plan.due-plan{border-color:#3b5862}
.plan-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
.plan-heading h2{margin:0;font-size:21px}
.plan-heading .eyebrow{margin-bottom:7px}
.plan-number{font-size:37px;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--accent2);font-weight:680}
.plan-number span{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.plan-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:9px 0 14px;min-height:40px}
.today-word-list{padding:0;margin:0 0 16px;list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.today-word-list li{border:1px solid var(--border);background:var(--raised);padding:9px 11px;border-radius:9px;font-size:14px;font-weight:550;word-break:break-word;min-width:0}
.plan-empty{font-size:14px;color:var(--soft);min-height:85px;margin:8px 0}
.more-words{margin:-4px 0 16px}
.more-words summary{color:var(--accent);font-size:13px;cursor:pointer;list-style:disclosure-closed}
.more-words[open] summary{margin-bottom:12px}
.more-words .today-word-list{margin-bottom:0}
.plan-overflow,.plan-note{color:var(--muted);font-size:12px;line-height:1.55}
.today-action{width:100%;min-height:48px;margin-top:auto}
.more-new-inline{border-top:1px solid var(--border);padding-top:15px;margin-top:17px}
.more-new-inline label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}
.more-new-inline .flex{gap:8px}
.more-new-inline input{max-width:85px;min-width:0}
.more-new-inline .flex button{flex:1}
.plan-note{margin-top:15px}
.active-study{display:flex;align-items:center;justify-content:space-between;gap:15px;border:1px solid #3c6975;background:#15303b;padding:14px 17px;border-radius:14px;margin-bottom:16px}

<script>
'use strict';
const STORAGE_KEY='wordflow_v1'; // retain v1 data for seamless upgrade
const DATA=[
['analyze','分析；解析','We need to analyze the results carefully.'],['approach','方法；接近','We need a different approach to this problem.'],['assess','评估；评价','The teacher will assess our progress.'],['assume','假设；认为','Do not assume that everyone agrees.'],['available','可获得的；有空的','The information is available online.'],['benefit','益处；使受益','Reading can benefit your vocabulary.'],['challenge','挑战；质疑','This task presents a new challenge.'],['circumstance','情况；环境','The decision depends on the circumstances.'],['concept','概念；观念','The concept is difficult to explain.'],['conduct','实施；行为','The researchers conduct an experiment.'],
['consequence','结果；后果','Every decision has a consequence.'],['considerable','相当大的；重要的','The project requires considerable effort.'],['consistent','一致的；持续的','Her results are consistent with the theory.'],['contribute','贡献；促成','Several factors contribute to success.'],['convince','使确信；说服','The evidence may convince the audience.'],['define','定义；界定','How would you define this term?'],['demonstrate','证明；展示','The experiment demonstrates the effect.'],['determine','确定；决定','We must determine the cause.'],['distribute','分发；分配','They distribute food to the families.'],['effective','有效的','This is an effective learning method.'],
['emphasize','强调；着重','The report emphasizes safety.'],['establish','建立；确立','The team hopes to establish a new system.'],['evaluate','评估；评价','We need to evaluate the evidence.'],['evidence','证据；迹象','There is little evidence for the claim.'],['expand','扩大；扩展','The company plans to expand overseas.'],['factor','因素；要素','Time is an important factor.'],['feature','特征；以……为特色','The new model has several useful features.'],['focus','关注；焦点','Focus on the most important question.'],['generate','产生；生成','The device can generate electricity.'],['identify','识别；确定','Can you identify the main problem?'],
['impact','影响；冲击','The discovery had a major impact.'],['indicate','表明；指出','The results indicate a clear trend.'],['interpret','解释；理解','People interpret the data differently.'],['maintain','维持；坚持','It is important to maintain good habits.'],['obtain','获得；得到','Researchers obtained new data.'],['occur','发生；出现','The event occurred last night.'],['perceive','感知；认为','People perceive risk differently.'],['predict','预测；预言','It is hard to predict the outcome.'],['principle','原则；原理','The device works on a simple principle.'],['process','过程；处理','Learning is a gradual process.'],
['respond','回应；作出反应','She did not respond to the question.'],['significant','重要的；显著的','The change is statistically significant.'],['specific','具体的；特定的','Please give a specific example.'],['strategy','策略；战略','We need a better strategy.'],['structure','结构；组织','The structure of the argument is clear.'],['sufficient','足够的；充分的','We do not have sufficient evidence.'],['tendency','倾向；趋势','There is a tendency to forget details.'],['transform','使改变；转变','Technology can transform education.'],['vary','变化；不同','Results may vary between groups.'],['verify','核实；验证','We should verify the information.']
];
const pad=n=>String(n).padStart(2,'0');
const DAY=86400000;
const dayKey=(date=new Date())=>`${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
const addDays=(n)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.getTime()};
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=id=>String(id||'');
const hasMeaning=w=>!!(w&&w.cn&&w.cn.trim()&&w.cn.trim()!=='（中文释义待补充）');
const typeName=t=>t==='review'?'到期复习':t==='new'?'新词学习':'综合学习';
const timeLabel=ms=>ms<=Date.now()?'现在':ms-Date.now()<3600000?`${Math.max(1,Math.ceil((ms-Date.now())/60000))} 分钟后`:`${Math.max(1,Math.round((ms-Date.now())/DAY))} 天后`;
function makeWord(en,cn,example=''){return {id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,9),en:en.trim(),cn:cn.trim(),example:example.trim(),seen:0,correct:0,wrong:0,repetitions:0,interval:0,ease:2.5,due:0,created:Date.now(),lapses:0}}
function initial(){return {words:DATA.map(x=>makeWord(...x)),target:30,today:{},typeAnswer:false,bootstrapped:Date.now()}}
function load(){try{const raw=localStorage.getItem('wordflow_v1');if(raw){const old=JSON.parse(raw);if(Array.isArray(old.words)){return {...initial(),...old,words:old.words.map(w=>({...makeWord(String(w.en||''),String(w.cn||''),String(w.example||'')),...w,ease:Number(w.ease)||2.5,interval:Number(w.interval)||0,repetitions:Number(w.repetitions)||0,seen:Number(w.seen)||0,due:Number(w.due)||0}))}}}}catch(e){}return initial()}
let db=load(),view='home',session=[],current=null,cycleStage=0,phaseOrder=[],phaseGrades={},phaseDone=0,revealed=false,typedCorrect=null,sessionDone=0,sessionTotal=0,sessionKind='mix',search='',libraryLimit=100,toastTimeout=0,editId=null;
function restoreSession(){const v=db.activeSession;if(!v||v.version!==3||!Array.isArray(v.queue))return;const ids=new Set(db.words.map(w=>w.id));session=v.queue.filter(id=>ids.has(id));current=db.words.find(w=>w.id===v.current)||null;phaseOrder=(v.order||[]).filter(id=>ids.has(id));phaseGrades=v.grades&&typeof v.grades==='object'?v.grades:{};cycleStage=v.stage===1?1:0;phaseDone=Math.max(0,Number(v.phaseDone)||0);sessionDone=Math.max(0,Number(v.done)||0);sessionTotal=Math.max(0,Number(v.total)||0);sessionKind=v.kind||'mix'}
function keepSession(){db.activeSession={version:3,queue:session.slice(),current:current?.id||null,stage:cycleStage,order:phaseOrder.slice(),grades:{...phaseGrades},phaseDone,done:sessionDone,total:sessionTotal,kind:sessionKind}}
restoreSession();
function toast(t){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>x.remove(),3300)}
function save(){keepSession();try{localStorage.setItem('wordflow_v1',JSON.stringify(db));return true}catch(e){toast('本机存储失败：请到设置导出 JSON 备份');return false}}
save();
function today(){const k=dayKey();if(!db.today||typeof db.today!=='object')db.today={};if(!db.today[k])db.today[k]={new:0,reviews:0,correct:0,total:0};return db.today[k]}
function dueWords(){return db.words.filter(w=>hasMeaning(w)&&w.seen>0&&(w.due||0)<=Date.now()).sort((a,b)=>(a.due||0)-(b.due||0))}
function newWords(){return db.words.filter(w=>!w.seen&&hasMeaning(w))}
function missingWords(){return db.words.filter(w=>!hasMeaning(w))}
function stats(){const t=today();return {total:db.words.length,learned:db.words.filter(w=>w.seen>0).length,due:dueWords().length,available:newWords().length,missing:missingWords().length,newToday:t.new||0,reviewedToday:t.reviews||0,answered:t.total||0,accuracy:t.total?Math.round(100*(t.correct||0)/t.total):0}}
const routes=[['home','⌂','今日概览'],['practice','◈','双向回忆'],['library','▤','我的词库'],['settings','⚙','设置与备份']];
const mobileLabels={home:'今日',practice:'学习',library:'词库',settings:'设置'};
function nav(){const renderNav=mobile=>routes.map(([id,icon,name])=>`<button class="${mobile?'':'navbtn '}${view===id?'active':''}" data-nav="${id}"><span class="${mobile?'':'navicon'}">${icon}</span>${mobile?mobileLabels[id]:name}</button>`).join('');document.getElementById('desktopNav').innerHTML=renderNav(false);document.getElementById('mobileNav').innerHTML=renderNav(true)}
function head(k,t,desc){return `<div class="topline"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="subhead">${desc}</p></div><div class="date-pill">${new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</div></div>`}
// FSRS-6 standard 21-parameter DSR model, default weights from open-spaced-repetition.
// One two-direction practice cycle counts as ONE FSRS review; grade=min(two directions).
// The desired retention is fixed at 90%; past SM-2 history cannot be reconstructed exactly.
const FSRS6_W=[0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS6_RETENTION=0.90;
const fsrsClamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fsrsD0=g=>fsrsClamp(FSRS6_W[4]-Math.exp(FSRS6_W[5]*(g-1))+1,1,10);
function fsrsRetention(elapsed,s){
 const decay=FSRS6_W[20],factor=Math.pow(.9,-1/decay)-1;
 return Math.pow(1+factor*Math.max(0,elapsed)/Math.max(.01,s),-decay);
}
function fsrsInterval(s){
 const decay=FSRS6_W[20],factor=Math.pow(.9,-1/decay)-1;
 return fsrsClamp(Math.round(Math.max(.01,s)*(Math.pow(FSRS6_RETENTION,-1/decay)-1)/factor),1,36500);
}
function fsrsNextState(state,g,elapsedDays){
 const p=FSRS6_W;
 if(!state||!(state.stability>0))return {stability:p[g-1],difficulty:fsrsD0(g),version:6};
 const S=fsrsClamp(Number(state.stability),.01,36500),D=fsrsClamp(Number(state.difficulty)||fsrsD0(3),1,10);
 const R=fsrsRetention(elapsedDays,S);
 let newS;
 if(elapsedDays<1){
   let multiplier=Math.exp(p[17]*(g-3+p[18]))*Math.pow(S,-p[19]);
   if(g>=2)multiplier=Math.max(1,multiplier);
   newS=S*multiplier;
 }else if(g===1){
   newS=p[11]*Math.pow(D,-p[12])*(Math.pow(S+1,p[13])-1)*Math.exp(p[14]*(1-R));
   newS=Math.min(newS,S/Math.exp(p[17]*p[18]));
 }else{
   const bonus=g===2?p[15]:g===4?p[16]:1;
   newS=S*(1+Math.exp(p[8])*(11-D)*Math.pow(S,-p[9])*(Math.exp(p[10]*(1-R))-1)*bonus);
 }
 const delta=-p[6]*(g-3)*(10-D)/9;
 const nextD=fsrsClamp(p[7]*fsrsD0(4)+(1-p[7])*(D+delta),1,10);
 return {stability:fsrsClamp(newS,.01,36500),difficulty:nextD,version:6};
}
function migrateFsrsWord(w){
 if(!w||!(Number(w.seen)>0)||w.fsrs?.version===6&&w.fsrs.stability>0)return w;
 const grade=(Number.isInteger(w.lastGrade)?fsrsClamp(w.lastGrade+1,1,4):3);
 // Preserve existing due date as-is; approximate state only when the word is next reviewed.
 w.fsrs={stability:fsrsClamp(Number(w.interval)||FSRS6_W[grade-1],.01,36500),difficulty:fsrsD0(grade),version:6,estimatedFromLegacy:true};
 return w;
}
function nextCalendarDay(n){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()}
function simulateFsrsReview(word,grade,now=Date.now()){
 const p=JSON.parse(JSON.stringify(word)); // Preview does not mutate stored progress.
 migrateFsrsWord(p);
 const g=grade+1;
 const elapsed=p.seen?Math.max(0,(now-(Number(p.lastReviewed)||now))/86400000):0;
 const next=fsrsNextState(p.seen?p.fsrs:null,g,elapsed);
 const nextDays=fsrsInterval(next.stability);
 const isForgot=grade===0;
 return {state:next,days:nextDays,due:isForgot?now+10*60000:nextCalendarDay(nextDays)};
}

function estimateInterval(w,grade){
 const v=simulateFsrsReview(w,grade);
 return grade===0?'10 分钟后':v.days+' 天后';
}
function schedule(w,grade){
 const now=Date.now();
 const update=simulateFsrsReview(w,grade,now);
 w.fsrs=update.state;
 w.due=update.due;
 w.interval=grade===0?0:update.days;
 w.repetitions=grade===0?0:(Number(w.repetitions)||0)+1;
 if(grade===0)w.lapses=(Number(w.lapses)||0)+1;
 w.lastReviewed=now;
 w.lastGrade=grade;
 return w.due;
}
function nextCard(){let id=session.shift();if(!id&&cycleStage===0&&phaseOrder.length){cycleStage=1;phaseDone=0;session=phaseOrder.slice();id=session.shift()}current=id?db.words.find(w=>w.id===id)||null:null;revealed=false;typedCorrect=null;}
function begin(type='mix',howMany=30){if(current){view='practice';render();return}const due=dueWords(),n=newWords(),cap=Math.min(500,Math.max(1,Number(howMany)||30));
 const planned=type==='review'?due.slice(0,60):type==='new'?n.slice(0,cap):[...due.slice(0,60),...n.slice(0,Math.max(0,db.target-today().new))];
 phaseOrder=planned.map(w=>w.id);session=phaseOrder.slice();phaseGrades={};cycleStage=0;phaseDone=0;sessionTotal=session.length;sessionDone=0;sessionKind=type;if(session.length)nextCard();else current=null;save();view='practice';render();if(!current)toast('当前没有符合条件的单词')}
function rateWord(grade){if(!current||!revealed||grade<0||grade>3)return;if(typedCorrect===false&&cycleStage===1&&grade>0){toast('拼写不正确，这轮需要选“忘记”');return}
 if(cycleStage===0){phaseGrades[current.id]=grade;phaseDone++;nextCard();save();render();if(cycleStage===1&&phaseDone===0)toast('英文→中文已完成，开始中文→英文的第二遍检查');return}
 const overall=Math.min(phaseGrades[current.id]??grade,grade);const w=current;const first=w.seen===0;const t=today();t.total=(t.total||0)+1;if(first)t.new=(t.new||0)+1;else t.reviews=(t.reviews||0)+1;if(overall>=2){t.correct=(t.correct||0)+1;w.correct=(w.correct||0)+1}else w.wrong=(w.wrong||0)+1;schedule(w,overall);w.seen=(w.seen||0)+1;sessionDone++;phaseDone++;nextCard();save();render();if(overall===0)toast(`已安排约 10 分钟后重练：${w.en}`)}
function homeWordPreview(words,limit=12){
 if(!words.length)return '<p class="plan-empty">当前没有需要处理的单词。</p>';
 const primary=words.slice(0,limit).map(w=>`<li>${escapeHTML(w.en)}</li>`).join('');
 const hidden=words.slice(limit).map(w=>`<li>${escapeHTML(w.en)}</li>`).join('');
 return `<ul class="today-word-list">${primary}</ul>${hidden?`<details class="more-words"><summary>展开其余 ${words.length-limit} 词</summary><ul class="today-word-list">${hidden}</ul></details>`:''}`;
}
function renderHome(){
 const s=stats(),reviews=dueWords(),dueBatch=reviews.slice(0,60),nextBatch=newWords().slice(0,Math.max(1,Number(db.target)||30));
 const active=current?`<section class="active-study"><span>上次的双向练习还没结束</span><button class="primary" data-nav="practice">继续本轮 →</button></section>`:'';
 return `${head('TODAY · FSRS-6','今天学什么','先处理到期复习，再学习下一批新词。其他单词不需要反复刷。')}
 ${active}
 <div class="today-summary">今日已复习 <strong>${s.reviewedToday}</strong> 词 · 今日新学 <strong>${s.newToday}</strong> 词 · 每日建议 <strong>${db.target}</strong> 词（不限量）</div>
 <div class="today-plans">
   <section class="panel today-plan due-plan" aria-label="今天需要复习的单词">
     <div class="plan-heading"><div><div class="eyebrow">01 · 到期旧词</div><h2>今天复习什么</h2></div><strong class="plan-number">${s.due}<span>词</span></strong></div>
     <p class="plan-desc">只显示到期的词。这里不显示中文释义，以免提前看到答案。</p>
     ${homeWordPreview(dueBatch)}
     ${reviews.length>60?`<p class="plan-overflow">当前先复习 60 个；剩余 ${reviews.length-60} 个会保留在到期队列，下轮继续。</p>`:''}
     <button class="primary today-action" data-action="review" ${!s.due||current?'disabled':''}>${s.due?`开始复习 ${dueBatch.length} 词`:'今日暂时没有到期词'}</button>
   </section>
   <section class="panel today-plan next-plan" aria-label="接下来要学的新单词">
     <div class="plan-heading"><div><div class="eyebrow">02 · 下一批新词</div><h2>今天接着学什么</h2></div><strong class="plan-number">${nextBatch.length}<span>词</span></strong></div>
     <p class="plan-desc">按照词库原有顺序，下面就是下一批要学的词。</p>
     ${homeWordPreview(nextBatch)}
     <button class="secondary today-action" data-action="new" ${!s.available||current?'disabled':''}>${s.available?`学习这 ${nextBatch.length} 个新词`:'词库中已无可学新词'}</button>
     <div class="more-new-inline"><label for="extraCount">多学一些（每次最多 500 词）</label><div class="flex"><input type="number" min="1" max="500" id="extraCount" class="small-input" value="30" inputmode="numeric"/><button class="secondary" data-action="more-new" ${!s.available||current?'disabled':''}>按数量继续学</button></div></div>
   </section>
 </div>
 ${s.missing?`<p class="plan-note">词库中另有 ${s.missing} 个词缺少中文释义，暂时不能参加双向回忆。可在「词库」中导入完整释义。</p>`:''}`;
}
function renderPractice(){const s=stats();const shell=`<div class="practice-page"><div class="practice-title"><div><div class="eyebrow">TWO-WAY RETRIEVAL</div><h1>双向回忆</h1></div><span class="mini-progress">第 ${cycleStage+1} 遍 · ${phaseDone}/${Math.max(sessionTotal,0)} 词</span></div>
 <div class="session-header"><div class="seg"><button class="selected" disabled>英→中，再中→英</button></div><label class="spell-toggle"><input type="checkbox" id="typeAnswer" ${db.typeAnswer?'checked':''}/> 中文→英文时用键盘拼写</label></div>`;
 if(!current)return shell+`<div class="panel" style="text-align:center;padding:47px 18px"><div class="eyebrow">${sessionDone?'COMPLETE':'READY'}</div><h2>${sessionDone?'本轮完成':'开始学习'}</h2><p class="hint">${sessionDone?`已完成 ${sessionDone} 个单词的双向回忆。仅在下次到期时再复习，今天不需要把全部旧词刷一遍。`:`当前有 ${s.due} 个到期词、${s.available} 个可学新词。`}</p><div class="button-row" style="justify-content:center"><button class="primary" data-action="review" ${!s.due?'disabled':''}>复习到期词</button><button class="secondary" data-action="new" ${!s.available?'disabled':''}>学习 ${Math.min(db.target,s.available)} 个新词</button></div></div></div>`;
 const w=current,cnStage=cycleStage===1,tag=w.seen?'复习':'新词',kind=cnStage?'第 2 步 · 中文 → 英文':'第 1 步 · 英文 → 中文';
 const total=Math.max(1,sessionTotal),completedPct=Math.round(100*(cycleStage*total+phaseDone)/(2*total));const top=`<div class="flex" style="justify-content:space-between;margin:5px 0 8px"><span class="hint">${tag} · ${kind}</span><span class="hint">本遍余 ${session.length+1} 词 · 总 ${sessionTotal} 词</span></div><div class="progress-track" style="height:6px;margin-bottom:14px"><div class="progress-fill" style="width:${completedPct}%"></div></div>`;
 const prompt=cnStage?w.cn:w.en,answer=cnStage?w.en:w.cn;
 const typed=cnStage&&db.typeAnswer;
 const revealMarkup=typed?`<div class="session-card spelling-card"><div class="tag">${kind}</div><div class="term cn">${escapeHTML(prompt)}</div>${revealed?`<div class="meaning">${escapeHTML(answer)}</div><div class="feedback ${typedCorrect?'right':'wrong'}">${typedCorrect?'拼写正确':'拼写不正确，本次计为忘记'}</div><button class="speak" data-action="speak">▶ 听发音</button>`:`<input id="spellInput" aria-label="根据中文拼写英文" class="spell-input" enterkeyhint="done" placeholder="输入英文单词" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="none"><div class="button-row"><button class="primary" data-action="check-spell">核对拼写</button></div>`}</div>`:
 `<div class="session-card ${revealed?'revealed-card':'tap-ready'}" ${!revealed?'role="button" tabindex="0" data-action="reveal" aria-label="轻点翻开答案"':''}><div class="tag">${kind}</div><div class="term ${cnStage?'cn':''}">${escapeHTML(prompt)}</div>${!cnStage?`<button class="speak" data-action="speak">▶ 听发音</button>`:''}${revealed?`<div class="meaning">${escapeHTML(answer)}</div>${cnStage?`<button class="speak" data-action="speak">▶ 听发音</button>`:''}${w.example?`<p class="example">${escapeHTML(w.example)}</p>`:''}`:`<p class="tap-tip">先在脑中回忆，再轻点查看答案</p>`}</div>`;
 const gradeLabels=[['忘记','again'],['困难','hard'],['记得','good'],['熟练','easy']];
 const btns=gradeLabels.map(([t,cls],i)=>`<button class="grade ${cls}" data-grade="${i}" ${typedCorrect===false&&i>0?'disabled':''}>${t}<small>${cnStage?estimateInterval(w,Math.min(phaseGrades[w.id]??i,i)):'第二遍后安排'}</small></button>`).join('');
 return shell+top+`<p class="two-way-note">整批词先英→中，再中→英；每词两遍的较弱成绩决定到期时间。${!cnStage?'当前先检查理解中文。':'现在检查能否反向想出英文。'}</p>`+revealMarkup+(revealed?`<div class="grade-dock"><div class="grade-grid">${btns}</div></div>`:`<p class="swipe-nudge">${typed?'输入英文后核对':'轻点卡片显示答案'}</p>`)+`</div>`}
function renderLibrary(){const subset=db.words.filter(w=>(w.en+' '+w.cn).toLowerCase().includes(search.toLowerCase()));const visible=subset.slice(0,libraryLimit);return `${head('YOUR WORD BANK','我的词库','保持原书导入顺序；缺释义的词不会进入双向复习。')}
 <div class="search-row"><input id="searchBox" aria-label="搜索单词" placeholder="搜索英文或中文释义…" value="${escapeHTML(search)}"><button class="primary" data-action="add-word">＋ 添加单词</button><button class="secondary" data-action="import-dialog">批量导入</button></div><div class="flex" style="justify-content:space-between;margin-bottom:12px"><span class="hint">显示 ${visible.length} / ${subset.length} 词（共 ${db.words.length}）</span><button class="ghost" data-action="export-csv">导出 CSV</button></div><div class="wordlist">${subset.length?visible.map(w=>`<div class="wordrow"><div><strong>${escapeHTML(w.en)}</strong><div class="sm">${!hasMeaning(w)?'待补中文':!w.seen?'尚未学过':w.due<=Date.now()?'到期复习':`下次 ${new Date(w.due).toLocaleDateString('zh-CN')}`}</div></div><div class="meaningcell">${escapeHTML(w.cn)}</div><div class="actioncell flex"><button class="mini-btn" data-edit="${key(w.id)}">编辑</button><button class="mini-btn" data-delete="${key(w.id)}" title="删除单词">×</button></div></div>`).join(''):`<div class="empty">没有匹配的单词</div>`}</div>${visible.length<subset.length?`<div class="button-row"><button class="secondary" data-action="more-words">继续显示 100 词（剩 ${subset.length-visible.length}）</button></div>`:''}`}
function renderSettings(){const s=stats();return `${head('PERSONALIZE','设置与备份','学习记录只保存在当前设备。切换网站地址不会自动迁移历史，请先备份。')}
 <div class="panel"><h2>学习计划</h2><div class="settings-row"><div><strong>每日新词建议值</strong><div class="quiet">用于首页快捷按钮和进度参考，不再限制当天学习数量</div></div><select id="targetSelect" class="small-input">${[5,10,15,20,30,40,50,80,100].map(n=>`<option value="${n}" ${n===db.target?'selected':''}>${n} 词</option>`).join('')}</select></div><div class="settings-row"><div><strong>词库情况</strong><div class="quiet">${s.total} 词；已有学习记录 ${s.learned}；缺中文 ${s.missing}</div></div><button class="secondary" data-nav="library">管理词库</button></div></div>
 <div class="panel" style="margin-top:15px"><h2>间隔复习规则</h2><p class="hint">使用 FSRS-6 记忆模型（默认 21 参数，目标保持率 90%）。整批先英→中、再中→英，取两次中较低的成绩，给每个单词计算下次到期日期。忘记的词约 10 分钟后可重练。默认参数尚未根据你的个人记录训练，不保证每天实际保持率正好为 90%。</p><p class="hint">到期队列每轮最多 60 个，剩余单词留待下一轮。旧版的复习次数和原定到期日会保留；因旧版不记录完整回忆历史，其 FSRS 初始状态只能近似估计。</p></div>
 <div class="panel" style="margin-top:15px"><h2>完整备份</h2><p class="hint">JSON 包含词库、学习次数、到期安排和正在进行的练习。更换网站或设备前一定要保存备份。</p><div class="flex"><button class="primary" data-action="export-json">下载 JSON 备份</button><button class="secondary" data-action="share-backup">分享到“文件”</button><button class="secondary" data-action="import-json">恢复备份</button><button class="secondary" data-action="import-dialog">导入词库 TXT / CSV</button></div><input id="jsonFile" type="file" accept=".json,application/json" hidden/><div class="footer-note">建议在 iPhone / iPad 上用 Safari 访问 GitHub Pages 并添加到主屏幕。不同设备不自动同步。清理网站数据会删除本机学习记录。</div></div>
 <div class="panel" style="margin-top:15px"><h2>重置</h2><button class="danger" data-action="reset-progress">只清空学习记录</button></div>`}
function render(){nav();document.getElementById('content').innerHTML=view==='home'?renderHome():view==='practice'?renderPractice():view==='library'?renderLibrary():renderSettings();if(view==='practice'&&db.typeAnswer&&cycleStage===1&&current&&!revealed&&window.innerWidth>700)document.getElementById('spellInput')?.focus()}
function openWordModal(id=null){editId=id;const w=id?db.words.find(w=>w.id===id):null;document.getElementById('modalTitle').textContent=w?'编辑单词':'添加单词';document.getElementById('formEn').value=w?.en||'';document.getElementById('formCn').value=w?.cn||'';document.getElementById('formExample').value=w?.example||'';document.getElementById('wordModal').showModal()}
function importDialog(){document.getElementById('importModal').showModal()}
function csvEscape(s){let t=String(s??'');return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function parseCSV(str){let out=[],row=[],field='',quotes=false;const first=(str.split(/\r?\n/)[0]||'');const sep=first.includes('\t')?'\t':',';for(let i=0;i<str.length;i++){const ch=str[i];if(ch==='"'){if(quotes&&str[i+1]==='"'){field+='"';i++}else quotes=!quotes}else if(ch===sep&&!quotes){row.push(field.trim());field=''}else if((ch==='\n'||ch==='\r')&&!quotes){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(field.trim());if(row.some(Boolean))out.push(row);row=[];field=''}else field+=ch}row.push(field.trim());if(row.some(Boolean))out.push(row);return out}
function isPos(s){return /^(?:(?:vt|vi|v|n|adj|adv|prep|pron|conj|interj|int|num|det|art|aux|modal)\.?\s*(?:[;,/、]\s*)?)+$/i.test(String(s||'').trim())}
function parseImportEntries(source){const str=String(source||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const lines=str.split('\n'),pipes=lines.some(l=>l.includes('|')||l.includes('\t'));const raw=pipes?lines.filter(l=>l.trim()).map(l=>l.includes('|')?l.split('|').map(x=>x.trim()):l.includes('\t')?l.split('\t').map(x=>x.trim()):parseCSV(l)[0]||[]):parseCSV(str);const out=[];for(const row of raw){const en=(row[0]||'').trim().replace(/^\uFEFF/,'');if(!en||en.startsWith('#'))continue;if(/^(英文|单词|english|headword)$/i.test(en)||(/^word$/i.test(en)&&row.length>1))continue;const a=(row[1]||'').trim(),b=(row[2]||'').trim();let cn='',example='',missingMeaning=false;if(!a){cn='（中文释义待补充）';missingMeaning=true}else if(isPos(a)&&b){cn=a+' '+b;example=row.slice(3).join(',').trim()}else {cn=a;example=row.slice(2).join(',').trim()}if(en.length>90||!/^[a-z][a-z'’ -]*$/i.test(en)||cn.length>250){out.push({invalid:true});continue}out.push({en,cn,example,missingMeaning})}return out}
function importWords(){const entries=parseImportEntries(document.getElementById('importText').value);let dupes=0,invalid=0,missing=0,updated=0;const known=new Map(db.words.map(w=>[w.en.toLowerCase(),w])),adds=[],ups=[];for(const item of entries){if(item.invalid){invalid++;continue}const prev=known.get(item.en.toLowerCase());if(prev){if(!hasMeaning(prev)&&!item.missingMeaning){ups.push({prev,item});updated++}else dupes++;continue}known.set(item.en.toLowerCase(),item);adds.push(item);if(item.missingMeaning)missing++}if(!adds.length&&!ups.length){toast(`没有新增：重复 ${dupes}，无效 ${invalid}`);return}if(missing>0&&!confirm(`${missing} 个单词没有中文释义：可导入保存，但要补齐中文后才能参加双向复习。继续吗？`))return;for(const item of adds)db.words.push(makeWord(item.en,item.cn,item.example.slice(0,500)));for(const {prev,item} of ups){prev.cn=item.cn;if(item.example&&!prev.example)prev.example=item.example.slice(0,500)}save();document.getElementById('importModal').close();document.getElementById('importText').value='';render();toast(`已导入 ${adds.length}，补齐释义 ${updated}，重复 ${dupes}，无效 ${invalid}`)}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCSV(){const out='英文,中文,例句\r\n'+db.words.map(w=>[w.en,w.cn,w.example].map(csvEscape).join(',')).join('\r\n');download(`词序-词库-${dayKey()}.csv`,'\uFEFF'+out,'text/csv;charset=utf-8')}
function exportJSON(){save();download(`词序-完整备份-${dayKey()}.json`,JSON.stringify(db,null,2),'application/json');toast('完整备份已下载')}
async function shareBackup(){save();const filename=`词序-完整备份-${dayKey()}.json`,file=new File([JSON.stringify(db,null,2)],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'词序完整备份'});return}catch(e){if(e.name==='AbortError')return}}download(filename,JSON.stringify(db,null,2),'application/json')}
function speak(){if(!current||!('speechSynthesis' in window))return toast('浏览器暂不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.en);u.lang='en-US';u.rate=.83;speechSynthesis.speak(u)}
function checkSpell(){if(!current||cycleStage!==1||!db.typeAnswer)return;const v=(document.getElementById('spellInput')?.value||'').trim().replace(/\s+/g,' ').toLowerCase();if(!v)return toast('请输入英文');typedCorrect=v===current.en.trim().replace(/\s+/g,' ').toLowerCase();revealed=true;save();render()}
function resetProgress(){if(!confirm('仅清空全部单词的记忆安排和学习记录，保留词库。确定吗？'))return;for(const w of db.words)Object.assign(w,{seen:0,correct:0,wrong:0,repetitions:0,interval:0,ease:2.5,due:0,lapses:0,fsrs:null,lastReviewed:0,lastGrade:null});db.today={};session=[];current=null;sessionDone=0;sessionTotal=0;phaseOrder=[];phaseGrades={};phaseDone=0;cycleStage=0;save();render();toast('已清空学习记录')}
document.body.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-action],[data-grade],[data-edit],[data-delete]');if(!el)return;if(el.dataset.nav){view=el.dataset.nav;render();return}if(el.dataset.grade!==undefined){rateWord(Number(el.dataset.grade));return}if(el.dataset.edit){openWordModal(el.dataset.edit);return}if(el.dataset.delete){const w=db.words.find(w=>w.id===el.dataset.delete);if(w&&confirm(`删除“${w.en}”及其所有学习记录吗？`)){db.words=db.words.filter(x=>x.id!==w.id);session=session.filter(x=>x!==w.id);phaseOrder=phaseOrder.filter(x=>x!==w.id);delete phaseGrades[w.id];if(current?.id===w.id)nextCard();save();render()}return}switch(el.dataset.action){case 'review':begin('review');break;case 'new':begin('new',db.target);break;case 'more-new':begin('new',document.getElementById('extraCount')?.value||30);break;case 'reveal':revealed=true;save();render();break;case 'speak':speak();break;case 'check-spell':checkSpell();break;case 'more-words':libraryLimit+=100;render();break;case 'add-word':openWordModal();break;case 'import-dialog':importDialog();break;case 'export-csv':exportCSV();break;case 'export-json':exportJSON();break;case 'share-backup':shareBackup();break;case 'import-json':document.getElementById('jsonFile')?.click();break;case 'reset-progress':resetProgress();break;}});
document.getElementById('csvFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{document.getElementById('importText').value=await f.text();toast('文件已读取，点击导入即可')}catch(err){toast('读取文件失败')}finally{e.target.value=''}});
document.getElementById('wordForm').addEventListener('submit',e=>{e.preventDefault();const en=document.getElementById('formEn').value.trim(),cn=document.getElementById('formCn').value.trim(),example=document.getElementById('formExample').value.trim();if(!en||!cn)return;const duplicate=db.words.find(w=>w.en.toLowerCase()===en.toLowerCase()&&w.id!==editId);if(duplicate)return toast('该单词已存在');const w=editId?db.words.find(w=>w.id===editId):null;if(w)Object.assign(w,{en,cn,example});else db.words.push(makeWord(en,cn,example));document.getElementById('wordModal').close();save();render();toast('单词已保存')});
document.getElementById('content').addEventListener('input',e=>{if(e.target.id==='searchBox'){search=e.target.value;libraryLimit=100;const pos=e.target.selectionStart;render();const n=document.getElementById('searchBox');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='targetSelect'){db.target=Number(e.target.value)||30;save();render()}if(e.target.id==='typeAnswer'){db.typeAnswer=e.target.checked;revealed=false;typedCorrect=null;save();render()}if(e.target.id==='jsonFile'){const f=e.target.files?.[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d||!Array.isArray(d.words)||!d.words.every(w=>typeof w.en==='string'&&typeof w.cn==='string'))throw Error('备份格式不正确');if(!confirm(`确认用备份替换当前全部 ${db.words.length} 个词及学习历史吗？`))return;db={...initial(),...d};db.words=db.words.map(w=>({...makeWord(String(w.en),String(w.cn),String(w.example||'')),...w}));current=null;session=[];phaseOrder=[];phaseGrades={};phaseDone=0;sessionDone=0;sessionTotal=0;restoreSession();save();render();toast('备份已恢复')}).catch(err=>toast('导入失败：'+err.message)).finally(()=>{e.target.value=''})}});
document.getElementById('content').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('tap-ready')){e.preventDefault();revealed=true;save();render()}});
document.addEventListener('keydown',e=>{if(e.target.closest('dialog')||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='Enter'&&e.target.id==='spellInput'){e.preventDefault();checkSpell()}return}if(view==='practice'&&current){if(e.code==='Space'&&!revealed&&!(db.typeAnswer&&cycleStage===1)){e.preventDefault();revealed=true;save();render()}else if(revealed&&['1','2','3','4'].includes(e.key)){rateWord(Number(e.key)-1)}}});
render();
if('serviceWorker' in navigator && typeof location!=='undefined' && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
