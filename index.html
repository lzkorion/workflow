// "pos" is prepended to Chinese meaning to remain compatible with existing localStorage data.
function isPos(s){return /^(?:(?:vt|vi|v|n|adj|adv|prep|pron|conj|interj|int|num|det|art|aux|modal)\.?\s*(?:[;,/、]\s*)?)+$/i.test(String(s||'').trim())}
function parseImportEntries(source){const str=String(source||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');const lines=str.split('\n');const hasPipeOrTabs=lines.some(l=>l.includes('|')||l.includes('\t'));const raw=hasPipeOrTabs?lines.filter(l=>l.trim()).map(l=>l.includes('|')?l.split('|').map(x=>x.trim()):l.includes('\t')?l.split('\t').map(x=>x.trim()):parseCSV(l)[0]||[]):parseCSV(str);const out=[];for(const row of raw){let en=(row[0]||'').trim().replace(/^\uFEFF/,'');if(!en||en.startsWith('#'))continue;if(/^(英文|单词|english|headword)$/i.test(en)||(/^(word)$/i.test(en)&&row.length>1&&row.slice(1).some(Boolean)))continue;let a=(row[1]||'').trim(),b=(row[2]||'').trim(),cn='',example='',missingMeaning=false;if(!a){cn='（中文释义待补充）';missingMeaning=true}else if(isPos(a)&&b){cn=a+' '+b;example=row.slice(3).join(',').trim()}else{cn=a;example=row.slice(2).join(',').trim()}if(en.length>90||! /^[a-z][a-z'’ -]*$/i.test(en)||cn.length>250){out.push({invalid:true});continue}out.push({en,cn,example,missingMeaning})}return out}
function importWords(){const entries=parseImportEntries(document.getElementById('importText').value);let added=0,dupes=0,invalid=0,withoutMeaning=0,updated=0;const known=new Map(db.words.map(w=>[w.en.toLowerCase(),w]));const newEntries=[],updatedEntries=[];for(const item of entries){if(item.invalid){invalid++;continue}const previous=known.get(item.en.toLowerCase());if(previous){if(previous.cn==='（中文释义待补充）'&&!item.missingMeaning){updatedEntries.push({previous,item});updated++;}else dupes++;continue}known.set(item.en.toLowerCase(),item);newEntries.push(item);if(item.missingMeaning)withoutMeaning++}if(!newEntries.length&&!updatedEntries.length){toast(`没有新词：重复 ${dupes}，无效 ${invalid}；请检查文件格式`);return}if(withoutMeaning>0&&!confirm(`检测到 ${withoutMeaning} 个单词没有中文释义。导入后仅能用于英文认读，中文→英文及拼写练习需要先补充释义。仍然导入吗？`))return;for(const item of newEntries)db.words.push(makeWord(item.en,item.cn,item.example.slice(0,500)));for(const {previous,item} of updatedEntries){previous.cn=item.cn;if(item.example&&!previous.example)previous.example=item.example.slice(0,500)}added=newEntries.length;save();document.getElementById('importModal').close();document.getElementById('importText').value='';render();toast(`导入 ${added} 词，补全释义 ${updated}，重复 ${dupes}，无效 ${invalid}${withoutMeaning?'，缺释义 '+withoutMeaning:''}`)}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCSV(){const s='英文,中文,例句\r\n'+db.words.map(w=>[w.en,w.cn,w.example].map(csvEscape).join(',')).join('\r\n');download(`词序-词库-${dayKey()}.csv`,'\uFEFF'+s,'text/csv;charset=utf-8');toast('CSV 已导出')}
function exportJSON(){save();download(`词序-完整备份-${dayKey()}.json`,JSON.stringify(db,null,2),'application/json');toast('完整备份已导出')}
async function shareBackup(){save();const filename=`词序-完整备份-${dayKey()}.json`;const file=new File([JSON.stringify(db,null,2)],filename,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'词序完整备份'});return}catch(e){if(e.name==='AbortError')return}}download(filename,JSON.stringify(db,null,2),'application/json');toast('已下载备份，请保存在「文件」App')}
function speak(){if(!current||!('speechSynthesis' in window)){toast('当前浏览器不支持语音朗读');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current.en);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function checkSpell(){if(!current)return;let v=(document.getElementById('spellInput')?.value||'').trim().replace(/\s+/g,' ').toLowerCase();if(!v){toast('请先输入英文');return}spellResult=v===current.en.trim().replace(/\s+/g,' ').toLowerCase();revealed=true;render()}
function resetProgress(){if(!confirm('只清空练习历史和间隔复习进度，保留全部词库与设置。确认继续？'))return;for(const w of db.words)Object.assign(w,{seen:0,correct:0,wrong:0,repetitions:0,interval:0,ease:2.5,due:0});db.today={};current=null;session=[];sessionDone=0;save();render();toast('学习记录已清空')}
document.body.addEventListener('click',e=>{let el=e.target.closest('[data-nav],[data-action],[data-mode],[data-direction],[data-grade],[data-edit],[data-delete]');if(!el)return;
if(el.dataset.nav){view=el.dataset.nav;render();return}
if(el.dataset.mode){db.mode=el.dataset.mode;if(db.mode==='spell'){db.direction='cn'}save();revealed=false;spellResult=null;render();return}
if(el.dataset.direction){db.direction=el.dataset.direction;save();revealed=false;spellResult=null;render();return}
if(el.dataset.grade!==undefined){rateWord(Number(el.dataset.grade));return}
if(el.dataset.edit){openWordModal(el.dataset.edit);return}
if(el.dataset.delete){const w=db.words.find(x=>x.id===el.dataset.delete);if(w&&confirm(`确定删除“${w.en}”及其学习记录吗？`)){db.words=db.words.filter(x=>x.id!==w.id);session=session.filter(x=>x!==w.id);if(current?.id===w.id)nextCard();save();render();toast('单词已删除')}return}
switch(el.dataset.action){case 'start':startSession();break;case 'reveal':revealed=true;render();break;case 'speak':speak();break;case 'check-spell':checkSpell();break;case 'next-spell':rateWord(spellResult?2:0);break;case 'more-words':libraryLimit+=100;render();break;case 'add-word':openWordModal();break;case 'import-dialog':importDialog();break;case 'export-csv':exportCSV();break;case 'export-json':exportJSON();break;case 'share-backup':shareBackup();break;case 'import-json':document.getElementById('jsonFile').click();break;case 'reset-progress':resetProgress();break;}}
);
document.getElementById('csvFile').addEventListener('change',async(e)=>{const f=e.target.files?.[0];if(!f)return;try{let data=await f.text();document.getElementById('importText').value=data;toast('文件已读取，请检查并点击导入')}catch(err){toast('读取文件失败')}finally{e.target.value=''}});
document.getElementById('wordForm').addEventListener('submit',e=>{e.preventDefault();const en=document.getElementById('formEn').value.trim(),cn=document.getElementById('formCn').value.trim(),example=document.getElementById('formExample').value.trim();if(!en||!cn)return;const duplicate=db.words.find(w=>w.en.toLowerCase()===en.toLowerCase()&&w.id!==editId);if(duplicate){toast('词库里已经有这个英文单词');return}let w=editId?db.words.find(w=>w.id===editId):null;if(w)Object.assign(w,{en,cn,example});else db.words.push(makeWord(en,cn,example));document.getElementById('wordModal').close();save();render();toast('已保存单词')});
document.getElementById('content').addEventListener('input',e=>{if(e.target.id==='searchBox'){search=e.target.value;libraryLimit=100;let pos=e.target.selectionStart;render();const n=document.getElementById('searchBox');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='targetSelect'){db.target=Number(e.target.value);save();render();toast('每日目标已更新')}});
document.getElementById('content').addEventListener('change',e=>{if(e.target.id==='jsonFile'){let file=e.target.files?.[0];if(!file)return;file.text().then(text=>{const d=JSON.parse(text);if(!d||!Array.isArray(d.words)||!d.words.every(w=>typeof w.en==='string'&&typeof w.cn==='string'))throw Error('格式不正确');if(!confirm(`确认使用备份替换当前全部词库与记录？备份中有 ${d.words.length} 词。`))return;db={...initial(),...d};db.target=Number(db.target)||30;db.today=db.today&&typeof db.today==='object'?db.today:{};current=null;session=[];sessionDone=0;sessionTotal=0;restoreSession();save();render();toast('备份已恢复')}).catch(err=>toast('导入失败：'+err.message)).finally(()=>{e.target.value=''})}});
document.getElementById('content').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('tap-ready')){e.preventDefault();revealed=true;render()}});
document.addEventListener('keydown',e=>{if(e.target.closest('dialog')||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)){if(e.key==='Enter'&&e.target.id==='spellInput'){e.preventDefault();checkSpell()}return}if(view==='practice'&&current&&db.mode==='card'){if(e.code==='Space'&&!revealed){e.preventDefault();revealed=true;render()}else if(revealed&&['1','2','3','4'].includes(e.key)){rateWord(Number(e.key)-1)}}});
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
